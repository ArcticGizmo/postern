name: CI

# Builds and runs the tests (including the installer's) on every pull request, on pushes to main, and by hand on any
# branch (workflow_dispatch). Docs and captures don't trigger a pull request run.
on:
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'captures/**']
  # main too, so install.ps1 (which the one-liner fetches straight from main) is checked as it lands.
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing here writes to the repo. Every action is pinned to a commit SHA (the version is in the trailing
# comment); Dependabot proposes bumps.
permissions:
  contents: read

# A newer push to the same PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build postern.slnx -c Release

      # --blame-hang-timeout turns a hung pipe test into a failure with a dump, instead of a run that sits until the
      # job timeout.
      - name: Test
        run: dotnet test postern.slnx -c Release --no-build --blame-hang-timeout 10m --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Windows PowerShell 5.1, because that's what the one-liner runs under on most machines. Its download checks
      # skip here (no releases\ folder), and nothing in it touches the network.
      - name: Test (installer)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-install.ps1

      # Every Sallyport scenario through a throwaway Postern (Sandbox) to fake-upstream, all on loopback. Debug builds,
      # because only they can approve Sallyport without a person there (--dev-auto-approve).
      - name: Test bed (Sallyport scenarios)
        shell: powershell
        run: |
          foreach ($project in 'src\Postern.App', 'tools\Postern.FakeUpstream', 'tools\Postern.Sallyport') {
            dotnet build $project -c Debug
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\testbed-run.ps1
          exit $LASTEXITCODE

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
