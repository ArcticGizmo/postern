name: Release

# Push a tag like v0.2.0 to publish a release. The tag is the version: it's stamped into every binary and the
# Velopack package, and installed copies see it through Tray -> Check for updates.
on:
  push:
    tags:
      - 'v*'

# Read-only by default: the build job compiles untrusted-ish inputs (NuGet packages, the toolchain) and never needs
# to write. Only the final `release` job gets contents: write, to create the GitHub Release.
# Every action is pinned to a commit SHA (the version is in the trailing comment); Dependabot proposes bumps.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json, so CI builds with the same SDK as a local build.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # vpk is pinned in .config/dotnet-tools.json, to the Velopack library version the app references.
      - name: Restore vpk CLI
        run: dotnet tool restore

      # Velopack needs SemVer, and a tag like v1.2 would otherwise fail much later, inside vpk.
      - name: Get version from tag
        id: version
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:GITHUB_REF_NAME' isn't vMAJOR.MINOR.PATCH." }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      # Postern is the security-critical component, so a red test never ships.
      - name: Test
        run: dotnet test postern.slnx -c Release --blame-hang-timeout 10m

      # Postern.exe and postern-cli.exe go into one folder, so the CLI ships with every install
      # (%LOCALAPPDATA%\Postern\current\postern-cli.exe) and is always the same version as the broker it talks to.
      - name: Publish
        run: |
          dotnet publish src/Postern.App/Postern.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.VERSION }} -o publish/
          dotnet publish src/Postern.Cli/Postern.Cli.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.VERSION }} -o publish/

      # Start menu only: a tray broker has no business on the desktop.
      - name: Pack with Velopack
        run: dotnet vpk pack --packId Postern --packTitle "Postern" --packVersion ${{ steps.version.outputs.VERSION }} --packDir publish/ --mainExe Postern.exe --shortcuts StartMenuRoot --icon src/Postern.App/Assets/postern.ico --outputDir releases/

      # Everything in releases/: Postern-win-Setup.exe, the portable .zip, and the update feed the in-app updater
      # reads (nupkg + RELEASES + releases.win.json).
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: releases/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    # The one job that writes: it creates the GitHub Release. It checks nothing out and builds nothing.
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist

      # SHA256SUMS.txt describes exactly the bytes being uploaded, so it's generated here from the files about to be
      # published rather than in the build job. It lets anyone check a download before running it.
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          if [ ! -f dist/Postern-win-Setup.exe ]; then
            echo "::error::Postern-win-Setup.exe is missing from the pack output."
            exit 1
          fi
          ( cd dist && LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt dist/SHA256SUMS.txt
          echo '### Published assets' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
